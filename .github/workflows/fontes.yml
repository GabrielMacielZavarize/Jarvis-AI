name: Fontes externas

# Consulta de verdade cada serviço que o Jarvis usa (IP, DNS, CNPJ, cotações, clima, teste de internet...)
# e confere se o formato da resposta continua o que o código lê. Roda toda semana e quando você pedir
# (Actions, Fontes externas, Run workflow). Fica de fora de pull request e de push: não bloqueia merge.
# Se uma fonte mudar ou sair do ar, o job fica vermelho e o log diz qual e por quê. Nada mais acontece.
on:
  schedule:
    # Segunda-feira, 11h UTC (8h em Brasília).
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fontes:
    name: python doctor.py --fontes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # Só o que a checagem importa (osint, quotes, weather, netcheck, tools): sem webcam, sem tela.
      - name: Dependências
        run: pip install -r requirements.txt
      # Sai com 0 (tudo ok), 1 (alguma fonte falhou) ou 2 (nenhuma falhou, mas alguma não foi alcançada).
      # Qualquer código diferente de 0 deixa o job vermelho.
      # A checagem do URLhaus só entra se existir o segredo JARVIS_URLHAUS_KEY (a chave grátis de auth.abuse.ch,
      # em Settings, Secrets and variables, Actions). Sem ele o segredo vem vazio e essa linha simplesmente não aparece.
      - name: Fontes externas
        env:
          JARVIS_URLHAUS_KEY: ${{ secrets.JARVIS_URLHAUS_KEY }}
        run: python doctor.py --fontes
