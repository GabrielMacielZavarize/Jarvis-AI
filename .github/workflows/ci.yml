name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Os testes de memória e de agenda esperam o fuso do Brasil.
  TZ: America/Sao_Paulo

jobs:
  python:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # xvfb e tk: o pyautogui do pc_control não importa sem tela. libegl1: o detector real do MediaPipe.
      - name: Pacotes do sistema
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb python3-tk libegl1 libgles2
      # No Linux o requirements.txt já deixa o openwakeword de fora e traz o opencv-contrib que o mediapipe usa.
      - name: Dependências
        run: pip install -r requirements.txt pytest
      - uses: actions/cache@v4
        with:
          path: .cache/models
          key: mediapipe-models-v1
      - name: Modelo do detector de rosto
        run: python -c "import presence; presence.ensure_model(presence.DETECTOR_MODEL)"
      # Gravar os .pyc no meio da primeira execução travava o test_dictation no runner (sem o .pyc ou com
      # ele já compilado passa). Um teste preso mais de 60 s despeja a pilha de todas as threads no log.
      - name: pytest
        timeout-minutes: 10
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: xvfb-run -a python -m pytest -q -rs -o faulthandler_timeout=60 tests

  web:
    name: vitest e build do HUD
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  hud:
    name: testes visuais do HUD
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dependências
        run: |
          pip install -r requirements.txt
          cd web && npm ci && npx playwright install --with-deps chromium
      - name: Build do HUD
        working-directory: web
        run: npm run build
      # O playwright.config.ts sobe python jarvis.py --no-agent e abre o HUD em modo simulação.
      - name: Playwright
        working-directory: web
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
