# Atualizações semanais das dependências. As menores (minor e patch) vêm juntas num PR por ecossistema;
# as maiores (major) chegam separadas, porque podem quebrar. O pip atualiza o requirements.in e o
# requirements.txt travado juntos (veja docs/instalacao.md).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      hud-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions-menores:
        update-types: [minor, patch]
